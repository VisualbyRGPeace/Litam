<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lì Tám — Tiến Lên</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div id="app">

    <!-- LOGIN -->
    <section id="loginScreen" class="screen active">
      <div class="login-card">
        <div class="logo">LÌ TÁM</div>
        <p class="subtitle">Tiến Lên Online</p>

        <input id="playerName" type="text" placeholder="Tên người chơi" maxlength="16" />

        <button id="loginBtn" class="primary-btn">
          VÀO GAME
        </button>
      </div>
    </section>

    <!-- HOME -->
    <section id="homeScreen" class="screen">
      <header class="topbar">
        <div class="brand">LÌ TÁM</div>

        <div class="profile">
          <span id="homePlayerName">Player</span>
          <button id="logoutBtn">Đăng xuất</button>
        </div>
      </header>

      <main class="home-content">
        <p class="eyebrow">GAME</p>
        <h1>Chọn trò chơi</h1>

        <div class="game-grid">

          <button id="tienLenBtn" class="game-card">
            <div class="game-icon">🃏</div>
            <h2>Tiến Lên</h2>
            <p>Tiến Lên miền Nam</p>
            <span>4 người chơi</span>
          </button>

          <div class="game-card disabled">
            <div class="game-icon">♠</div>
            <h2>Xì Dách</h2>
            <p>Đang phát triển</p>
            <span>Coming soon</span>
          </div>

          <div class="game-card disabled">
            <div class="game-icon">♟</div>
            <h2>Cờ Vua</h2>
            <p>Đang phát triển</p>
            <span>Coming soon</span>
          </div>

        </div>
      </main>
    </section>

    <!-- LOBBY -->
    <section id="lobbyScreen" class="screen">
      <header class="topbar">
        <div class="brand">LÌ TÁM</div>

        <button id="backHomeBtn">
          ← Trang chủ
        </button>
      </header>

      <main class="lobby">
        <div class="lobby-header">
          <div>
            <p class="eyebrow">TIẾN LÊN</p>
            <h1>Phòng chơi</h1>
          </div>

          <button id="createRoomBtn" class="primary-btn">
            + TẠO PHÒNG
          </button>
        </div>

        <div id="roomList" class="room-list"></div>
      </main>
    </section>

    <!-- GAME -->
    <section id="gameScreen" class="screen game-screen">

      <header class="game-topbar">
        <div class="brand">LÌ TÁM</div>

        <div class="room-info">
          PHÒNG <strong id="roomIdText">----</strong>
        </div>

        <button id="leaveGameBtn">
          Rời phòng
        </button>
      </header>

      <main class="table">

        <!-- PLAYER 2 -->
        <div class="opponent opponent-top">
          <div class="avatar">P2</div>

          <div>
            <strong>Player 2</strong>
            <small id="p2Count">13 lá</small>
          </div>
        </div>

        <!-- PLAYER 3 -->
        <div class="opponent opponent-left">
          <div class="avatar">P3</div>

          <div>
            <strong>Player 3</strong>
            <small id="p3Count">13 lá</small>
          </div>
        </div>

        <!-- PLAYER 4 -->
        <div class="opponent opponent-right">
          <div class="avatar">P4</div>

          <div>
            <strong>Player 4</strong>
            <small id="p4Count">13 lá</small>
          </div>
        </div>

        <!-- CENTER -->
        <div class="center-table">

          <div id="turnText" class="turn-text">
            Đang chia bài...
          </div>

          <div id="playedCards" class="played-cards"></div>

          <div id="message" class="game-message"></div>

        </div>

        <!-- CURRENT PLAYER -->
        <div class="my-player">

          <div class="my-info">
            <div class="avatar large">ME</div>

            <div>
              <strong id="gamePlayerName">Player</strong>
              <small id="myCardCount">13 lá</small>
            </div>
          </div>

          <div id="myHand" class="hand"></div>

          <div class="actions">
            <button id="passBtn" class="secondary-btn">
              BỎ LƯỢT
            </button>

            <button id="playBtn" class="primary-btn">
              ĐÁNH
            </button>
          </div>

        </div>

      </main>
    </section>

  </div>

  <script src="./script.js"></script>
</body>
</html>
